<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/Admin/admin-css/admin.css">
    <link rel="stylesheet" href="/Admin/admin-css/sidebar.css">
    <link rel="stylesheet" href="/Admin/admin-css/editar-pet.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <script>
        if (sessionStorage.getItem("adminLogado") !== "true") {
            window.location.href = "http://127.0.0.1:5500/Admin/login.html";
        }
    </script>

    <title>Editar Pet | Patas ao Lar</title>
</head>

<body>

    <!-- MENU LATERAL -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            <img src="../../src/images/Logo.png" alt="Patas ao Lar">

            <div class="sidebar-logo-text">

                <h2>Patas ao Lar</h2>

                <span>Painel Administrativo</span>

            </div>

        </div>


        <nav class="menu">

            <a href="inicio.html">
                <i class="fa-solid fa-house"></i>
                <span>Início</span>
            </a>


            <a href="animais.html">
                <i class="fa-solid fa-paw"></i>
                <span>Animais</span>
            </a>


            <a href="cadastro-pet.html">
                <i class="fa-solid fa-plus"></i>
                <span>Cadastrar Pet</span>
            </a>


            <a href="editar-pet.html" class="menu-ativo">
                <i class="fa-solid fa-pen"></i>
                <span>Editar Pet</span>
            </a>

        </nav>


        <div class="menu-final">

            <a href="../../index.html">
                <i class="fa-solid fa-globe"></i>
                <span>Ver site</span>
            </a>


            <a href="../login.html">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Sair</span>
            </a>

        </div>

    </aside>


    <!-- CONTEÚDO -->

    <main class="conteudo-admin">

        <div class="cabecalho-pagina">

            <span class="pagina-tag">
                GERENCIAMENTO
            </span>

            <h1>
                Editar Pet
            </h1>

            <p>
                Selecione um animal para alterar suas informações.
            </p>

        </div>


        <!-- LISTA DE PETS -->

        <section class="lista-editar">

            <div id="lista-pets" class="lista-pets">
                <!-- Os pets serão carregados pelo JavaScript -->
            </div>

        </section>


        <!-- EDITOR -->

        <section id="editor-pet" class="editor-pet" style="display: none;">

            <div class="editor-cabecalho">

                <h2>
                    Editando:
                    <span id="nome-pet-editor"></span>
                </h2>


                <button type="button" id="voltar-lista" class="btn-voltar">

                    <i class="fa-solid fa-arrow-left"></i>

                    Voltar

                </button>

            </div>


            <form id="form-editar-pet">

                <div class="campo-edicao">

                    <label for="editar-nome">
                        Nome
                    </label>

                    <input type="text" id="editar-nome" required>

                </div>


                <div class="campo-edicao">

                    <label for="editar-especie">
                        Espécie
                    </label>

                    <select id="editar-especie" required>

                        <option value="Cachorro">
                            Cachorro
                        </option>

                        <option value="Gato">
                            Gato
                        </option>

                    </select>

                </div>


                <div class="campo-edicao">

                    <label for="editar-idade">
                        Idade
                    </label>

                    <input type="text" id="editar-idade" required>

                </div>


                <div class="campo-edicao">

                    <label for="editar-fase">
                        Fase da vida
                    </label>

                    <select id="editar-fase" required>

                        <option value="Filhote">
                            Filhote
                        </option>

                        <option value="Adulto">
                            Adulto
                        </option>

                        <option value="Idoso">
                            Idoso
                        </option>

                    </select>

                </div>


                <div class="campo-edicao">

                    <label for="editar-raca">
                        Raça
                    </label>

                    <input type="text" id="editar-raca" required>

                </div>


                <div class="campo-edicao">

                    <label for="editar-sexo">
                        Sexo
                    </label>

                    <select id="editar-sexo" required>

                        <option value="Macho">
                            Macho
                        </option>

                        <option value="Fêmea">
                            Fêmea
                        </option>

                    </select>

                </div>


                <div class="campo-edicao">

                    <label for="editar-porte">
                        Porte
                    </label>

                    <select id="editar-porte" required>

                        <option value="Pequeno">
                            Pequeno
                        </option>

                        <option value="Médio">
                            Médio
                        </option>

                        <option value="Grande">
                            Grande
                        </option>

                    </select>

                </div>


                <div class="campo-edicao">

                    <label for="editar-castrado">
                        Castrado
                    </label>

                    <select id="editar-castrado" required>

                        <option value="true">
                            Sim
                        </option>

                        <option value="false">
                            Não
                        </option>

                    </select>

                </div>


                <div class="campo-edicao">

                    <label for="editar-vacinado">
                        Vacinado
                    </label>

                    <select id="editar-vacinado" required>

                        <option value="true">
                            Sim
                        </option>

                        <option value="false">
                            Não
                        </option>

                    </select>

                </div>


                <div class="campo-edicao">

                    <label for="editar-pelagem">
                        Pelagem
                    </label>

                    <input type="text" id="editar-pelagem" required>

                </div>


                <div class="campo-edicao">

                    <label for="editar-foto">
                        Nova foto
                    </label>

                    <input type="file" id="editar-foto" accept="image/*">

                    <small>
                        Deixe vazio para manter a foto atual.
                    </small>

                </div>


                <div class="campo-edicao campo-edicao-grande">

                    <label for="editar-descricao">
                        Sobre o pet
                    </label>

                    <textarea id="editar-descricao" required></textarea>

                </div>


                <div class="acoes-editor">

                    <button type="button" id="cancelar-edicao" class="btn-cancelar">
                        Cancelar
                    </button>


                    <button type="submit" class="btn-salvar">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Salvar alterações

                    </button>

                </div>


                <p id="mensagem-edicao" class="mensagem-edicao"></p>

            </form>

        </section>

    </main>


    <!-- MODAL DE MENSAGEM -->

    <div id="modal-mensagem" class="modal-overlay" style="display: none;">

        <div class="modal-box modal-mensagem-box">

            <div class="modal-icone mensagem-icone">

                <i class="fa-solid fa-check"></i>

            </div>


            <h2 id="titulo-mensagem">
                Pet atualizado
            </h2>


            <p id="texto-mensagem">
                As informações do pet foram atualizadas com sucesso.
            </p>


            <button type="button" id="fechar-mensagem" class="modal-btn modal-btn-ok">
                Fechar
            </button>

        </div>

    </div>


    <script src="/Admin/admin-js/admin.js"></script>
    <script src="/Admin/admin-js/editar-pet.js"></script>

</body>

</html>
